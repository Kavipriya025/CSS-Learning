<!DOCTYPE html>
<html>
    <head>
        <title>flex</title>
        <style>
            h1{
                border:1px solid black;
                background-color: black;
                margin: 2px;
                padding:5px;
                color:white;
            }
            .container{
                display: flex;
                flex-wrap:wrap;
                width:300px;
                border:2px solid red;
                background-color: greenyellow;

            }

        </style>
    </head>
    <body>
        <div class="container">
        <h1>one</h1>
        <h1>Two</h1>
        <h1>Three</h1>
        <h1>Four</h1>
        <h1>Five</h1>
        <h1>Six</h1>
        </div>
    </body>
</html>
